name: Primitive integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primitive-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: External consumers and real execution
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Install existing dependencies
        run: mix deps.get
      - name: Build checksummed native tools
        run: python3 evaluation/integration/bootstrap.py --prefix tmp/native-tools
      - name: Validate all primitives outside the umbrella
        run: |
          export PATH="$PWD/tmp/native-tools/bin:$PATH"
          mix rampart.integration --output tmp/rampart-integration.json
      - name: Retain reports, exact replay evidence, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primitive-integration
          path: |
            tmp/rampart-integration.json
            tmp/rampart-integration.artifacts/
            tmp/native-tools/*log
          if-no-files-found: warn
